name: Validate AI Skills

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skill structure
        run: npm run validate

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Verify CLI
        run: |
          node bin/edp-ai-skills.js doctor
          node bin/edp-ai-skills.js list > /tmp/skills.txt
          test -s /tmp/skills.txt
